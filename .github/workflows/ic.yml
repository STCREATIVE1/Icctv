name: Filter ICC TV Global Events

on:
  workflow_dispatch: # Isse aap GitHub Actions tab se manual "Run workflow" button daba kar run kar payenge
  schedule:
    - cron: '0 */6 * * *' # Har 6 ghante mein yeh automatic run ho jayega (aap ise apne hisaab se badal sakte hain)

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Repository ka code runner par checkout karein
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Step 2: Python environment setup karein
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # Step 3: Script run karein (Yahan aapki file ka naam 'ic.py' hai)
    - name: Run Filter Script
      run: |
        python ic.py

    # Step 4 (Optional): Agar aap chahte hain ki filtered file wapas repository mein commit/save ho jaye
    - name: Commit and Push Filtered JSON
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.io"
        git add icc_tv_global.json
        git diff --staged --quiet || git commit -m "Auto-update ICC TV global filtered JSON"
        git push
