name: Update ICC Live Streams (Manual)

on:
  workflow_dispatch: # Yeh sirf manual run ke liye enabled hai

jobs:
  scrape-live:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Live Scraper Script
        run: python icc_live_scraper.py

      - name: Commit and Push Live Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add icc_live_matches.json
          git commit -m "Manual update ICC live matches data [skip ci]" || echo "No changes to commit"
          git push
