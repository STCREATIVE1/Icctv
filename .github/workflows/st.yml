name: Sync ICC TV Matches

on:
  scheduled:
    - cron: '0 */6 * * *' # Har 6 ghante mein auto-run hoga
  workflow_dispatch:      # Manual run karne ke liye button bhi milega

permissions:
  contents: write         # Repository par auto-commit aur push karne ke liye permissions zaroori hain

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Scraper Script
      run: |
        python st.py  # Agar aapne script ka naam 'ic.py' rakha hai toh yehi chalega

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add icc_scraped_matches.json icc_tv_global.json || true
        git commit -m "Auto-update ICC TV matches data [skip ci]" || true
        git push
        
