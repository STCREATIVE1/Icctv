name: Update ICC Data

on:
  schedule:
    # Har 15 minute mein automatically run hoga
    - cron: '*/15 * * * *'
  workflow_dispatch: # GitHub dashboard se manually run karne ke liye

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Icc1.py Script
        run: |
          python icc12.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add icc.json
          git diff --staged --quiet || (git commit -m "Auto update icc.json" && git push)
