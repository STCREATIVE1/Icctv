name: Update ICC Streams Data (Manual)

on:
  workflow_dispatch: # Yeh sirf manual run ke liye enabled hai

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper Script
        run: python icc_all_matches_scraper.py

      - name: Commit and Push JSON Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add icc_matches_data.json
          git commit -m "Manual update ICC matches data [skip ci]" || echo "No changes to commit"
          git push
