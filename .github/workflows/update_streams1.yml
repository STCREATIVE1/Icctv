name: Update ICC Streams and Playlist (Manual)

on:
  workflow_dispatch: # Yeh sirf manual trigger ke liye hai

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Step 1 - Run Scraper Script
        run: python icc_all_matches_scraper.py

      - name: Step 2 - Convert JSON to M3U
        run: python json_to_m3u.py

      - name: Commit and Push Updated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add icc_matches_data.json playlist.m3u
          git commit -m "Auto-update ICC matches data and playlist [skip ci]" || echo "No changes to commit"
          git push
